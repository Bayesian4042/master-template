name: Dependency Audit

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  audit:
    runs-on: codebuild-org-gha-runner-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11.5.0

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"

      - name: Audit dependencies
        run: pnpm audit --prod --audit-level critical
